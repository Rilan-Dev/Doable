name: AI Platform Core Extraction Verification

on:
  push:
    branches:
      - ai-platform-core-extraction
    paths:
      - "ai-platform-core/**"
  workflow_dispatch:

jobs:
  verify-extraction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify dependency inventory
        run: node ai-platform-core/external-dependencies/verify-external-dependencies.mjs
      - name: Verify immutable extraction
        run: node ai-platform-core/verification/verify-extraction.mjs
      - name: Verify no extraction changes outside package
        shell: bash
        run: |
          git diff-tree --no-commit-id --name-only -r HEAD | awk 'BEGIN{ok=1} !/^ai-platform-core\// {print; ok=0} END{exit ok?0:1}'
