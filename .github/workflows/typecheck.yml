name: Typecheck

# apps/web and services/api both reach a clean `tsc --noEmit`; this keeps
# them there.
# The notebooklm bug it fixed - UI reading store fields that were never
# written - compiled fine as JS and only surfaced under the type checker,
# so a build-only gate would not have caught it.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    name: apps/web + services/api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile on purpose: a lockfile that has drifted from
      # package.json is itself a defect worth failing on. That exact drift
      # (945dba4) made every source build fail.
      - name: Install
        run: pnpm install --frozen-lockfile

      # services/api imports `docore` and `dovault` by package name. Both
      # emit their .d.ts via `tsc`, so without building them first every
      # such import is TS2307 and each use degrades to an implicit any.
      # The Dockerfile builds them for the same reason; unlike the
      # Dockerfile this does not swallow failures, since both compile
      # clean and a genuine break should be reported as itself rather
      # than as a wall of missing-module errors downstream.
      - name: Build workspace type deps
        run: |
          pnpm --filter=docore run build
          pnpm --filter=dovault run build

      - name: tsc --noEmit (apps/web)
        run: pnpm --filter @doable/web exec tsc --noEmit -p tsconfig.json

      # services/api reached zero errors in the same pass that added this
      # step. It is checked in the same job so one lockfile install covers
      # both workspaces. `if: always()` so a failure in web still reports
      # the api result rather than masking it.
      - name: tsc --noEmit (services/api)
        if: always()
        run: pnpm --filter @doable/api exec tsc --noEmit -p tsconfig.json
